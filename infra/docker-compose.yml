# TrackFolio full stack: 4 app services + Postgres + Mongo + Redis.
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml up --build
#   open http://localhost:8088   (frontend)
name: trackfolio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trackfolio
      POSTGRES_PASSWORD: trackfolio
      POSTGRES_DB: trackfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trackfolio]

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trackfolio]

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trackfolio]

  scraper:
    build: ../services/scraper-go
    environment:
      HTTP_ADDR: ":8081"
      SCRAPE_WORKERS: "10"
      POSTGRES_URL: "postgres://trackfolio:trackfolio@postgres:5432/trackfolio?sslmode=disable"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "trackfolio"
      REDIS_ADDR: "redis:6379"
      DEDUP_TTL_SECONDS: "86400"
      SCRAPE_SOURCES: "greenhouse|gitlab,greenhouse|stripe,lever|netflix,remoteok|"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    networks: [trackfolio]

  match-service:
    build: ../services/match-service-py
    ports:
      - "8000:8000"
    networks: [trackfolio]

  api-gateway:
    build: ../services/api-gateway-node
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://trackfolio:trackfolio@postgres:5432/trackfolio"
      MATCH_SERVICE_URL: "http://match-service:8000"
      SCRAPER_URL: "http://scraper:8081"
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8080:8080"
    networks: [trackfolio]

  frontend:
    build: ../services/frontend-react
    depends_on:
      - api-gateway
    ports:
      - "8088:80"
    networks: [trackfolio]

volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  trackfolio:
    driver: bridge
