# TrackFolio full stack: 4 app services + Postgres + Mongo + Redis.
# Usage:  docker compose -f infra/docker-compose.yml up --build
# Then open http://localhost:5173

name: trackfolio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackfolio
    # schema.sql runs automatically on first init of an empty data dir.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [trackfolio]

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [trackfolio]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [trackfolio]

  scraper:
    build: ../services/scraper-go
    environment:
      SCRAPER_HTTP_ADDR: ":8081"
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/trackfolio?sslmode=disable
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: trackfolio
      REDIS_ADDR: redis:6379
      SCRAPER_SOURCES: greenhouse:stripe,greenhouse:airbnb,lever:netflix
      SCRAPER_WORKERS: "10"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    networks: [trackfolio]

  match-service:
    build: ../services/match-service-py
    environment:
      MATCH_PORT: "8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "8082:8082"
    networks: [trackfolio]

  api-gateway:
    build: ../services/api-gateway-node
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trackfolio
      SCRAPER_URL: http://scraper:8081
      MATCH_SERVICE_URL: http://match-service:8082
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "8080:8080"
    networks: [trackfolio]

  frontend:
    build: ../services/frontend-react
    depends_on:
      - api-gateway
    ports:
      - "5173:80"
    networks: [trackfolio]

volumes:
  pgdata:
  mongodata:
  redisdata:

networks:
  trackfolio:
    driver: bridge
