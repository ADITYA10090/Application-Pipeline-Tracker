apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: trackfolio
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: trackfolio/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: trackfolio-secrets, key: DATABASE_URL } }
            - name: MATCH_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: trackfolio-config, key: MATCH_SERVICE_URL } }
            - name: SCRAPER_URL
              valueFrom: { configMapKeyRef: { name: trackfolio-config, key: SCRAPER_URL } }
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: trackfolio
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
