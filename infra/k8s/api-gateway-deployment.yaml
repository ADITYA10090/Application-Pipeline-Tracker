apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: trackfolio
  labels: { app: api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: trackfolio/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: trackfolio-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: trackfolio-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: trackfolio
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
