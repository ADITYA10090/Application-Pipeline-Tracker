apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper
  namespace: trackfolio
spec:
  replicas: 1
  selector:
    matchLabels: { app: scraper }
  template:
    metadata:
      labels: { app: scraper }
    spec:
      containers:
        - name: scraper
          image: trackfolio/scraper:latest
          imagePullPolicy: IfNotPresent # use image built into minikube's docker
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: trackfolio-config }
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: POSTGRES_URL
              valueFrom: { secretKeyRef: { name: trackfolio-secrets, key: POSTGRES_URL } }
          # Requests/limits give the HPA a CPU target to scale against.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: scraper
  namespace: trackfolio
spec:
  selector: { app: scraper }
  ports:
    - port: 8081
      targetPort: 8081
