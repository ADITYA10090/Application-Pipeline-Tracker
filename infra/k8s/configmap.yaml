apiVersion: v1
kind: ConfigMap
metadata:
  name: trackfolio-config
  namespace: trackfolio
data:
  # Service discovery (cluster DNS names).
  MONGO_URI: "mongodb://mongo:27017"
  MONGO_DB: "trackfolio"
  REDIS_ADDR: "redis:6379"
  SCRAPER_HTTP_ADDR: ":8081"
  SCRAPER_SOURCES: "greenhouse:stripe,greenhouse:airbnb,lever:netflix"
  SCRAPER_WORKERS: "10"
  SCRAPER_URL: "http://scraper:8081"
  MATCH_SERVICE_URL: "http://match-service:8082"
  PORT: "8080"
  # Non-secret DB coordinates; the password comes from the Secret.
  PGHOST: "postgres"
  PGDATABASE: "trackfolio"
