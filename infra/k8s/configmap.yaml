apiVersion: v1
kind: ConfigMap
metadata:
  name: trackfolio-config
  namespace: trackfolio
data:
  # Non-secret configuration shared across services. DB hostnames match the
  # Service names below.
  MONGO_URI: "mongodb://mongo:27017"
  MONGO_DB: "trackfolio"
  REDIS_ADDR: "redis:6379"
  DEDUP_TTL_SECONDS: "86400"
  SCRAPE_WORKERS: "10"
  SCRAPE_SOURCES: "greenhouse|gitlab,greenhouse|stripe,lever|netflix,remoteok|"
  MATCH_SERVICE_URL: "http://match-service:8000"
  SCRAPER_URL: "http://scraper:8081"
  # Non-secret DB coordinates; the password comes from the Secret.
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "trackfolio"
  POSTGRES_USER: "trackfolio"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: trackfolio
data:
  # Mounted into the postgres init dir. Keep in sync with db/schema.sql.
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS companies (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL UNIQUE,
        website TEXT,
        career_page_url TEXT,
        industry TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS job_postings (
        id SERIAL PRIMARY KEY,
        company_id INTEGER NOT NULL REFERENCES companies(id) ON DELETE CASCADE,
        title TEXT NOT NULL,
        url TEXT NOT NULL UNIQUE,
        location TEXT,
        posted_date TIMESTAMPTZ,
        scraped_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        mongo_jd_ref TEXT,
        status TEXT NOT NULL DEFAULT 'new'
    );
    CREATE INDEX IF NOT EXISTS idx_job_postings_company ON job_postings(company_id);
    CREATE TABLE IF NOT EXISTS resume_versions (
        id SERIAL PRIMARY KEY,
        filename TEXT NOT NULL,
        content_hash TEXT NOT NULL,
        tailored_for_job_id INTEGER REFERENCES job_postings(id) ON DELETE SET NULL,
        uploaded_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS applications (
        id SERIAL PRIMARY KEY,
        job_posting_id INTEGER NOT NULL REFERENCES job_postings(id) ON DELETE CASCADE,
        resume_version TEXT,
        applied_date TIMESTAMPTZ,
        current_status TEXT NOT NULL DEFAULT 'wishlist',
        match_score REAL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_applications_status ON applications(current_status);
    CREATE TABLE IF NOT EXISTS status_events (
        id SERIAL PRIMARY KEY,
        application_id INTEGER NOT NULL REFERENCES applications(id) ON DELETE CASCADE,
        status TEXT NOT NULL,
        source TEXT NOT NULL DEFAULT 'manual' CHECK (source IN ('manual','email_parsed')),
        occurred_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_status_events_app ON status_events(application_id);
