apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: trackfolio
  labels: { app: match-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: match-service }
  template:
    metadata:
      labels: { app: match-service }
    spec:
      containers:
        - name: match-service
          image: trackfolio/match-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 8
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: match-service
  namespace: trackfolio
spec:
  selector: { app: match-service }
  ports:
    - port: 8082
      targetPort: 8082
